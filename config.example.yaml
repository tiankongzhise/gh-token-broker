database_path: data/gh-token-broker.db
secret_backend: encrypted-sqlite-with-wcm-master-key
master_key_target: gh-token-broker/master-key
github:
  host: github.com
  base_url: https://github.com
  api_base_url: https://api.github.com
  client_secret_ref: github/app-client-secret
token:
  parent_refresh_skew: 10m
