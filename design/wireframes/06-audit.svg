<text x="256" y="354" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">empty: 当前筛选无审计事件</text>
<text x="256" y="376" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">error: audit store unavailable / corrupted query</text>
<rect x="920" y="254" width="290" height="440" rx="4" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="936" y="282" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">详情 drawer</text>
<text x="936" y="310" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">完整 event metadata</text>
<text x="936" y="332" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">correlation id 可复制</text>
<text x="936" y="354" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">secret fingerprint / last-eight only</text>
<text x="936" y="376" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">details_json 脱敏展示</text>
<text x="936" y="398" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">链接：相关 token issue / grant / agent</text>
