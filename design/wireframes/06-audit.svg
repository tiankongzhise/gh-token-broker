<rect x="240" y="104" width="970" height="120" rx="4" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="256" y="132" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Filters</text>
<text x="256" y="160" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">time range · actor/agent · event type · repo · result · correlation id</text>
<text x="256" y="182" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">quick filters: failures only · reauth · high-risk admin actions</text>
