<text x="30" y="320" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#222" text-anchor="start">Settings</text>
<rect x="14" y="348" width="182" height="38" rx="4" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>
<text x="30" y="372" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#222" text-anchor="start">Advanced: Agents</text>
<rect x="14" y="400" width="182" height="38" rx="4" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>
<text x="30" y="424" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#222" text-anchor="start">Advanced: Tokens</text>
<rect x="14" y="704" width="182" height="88" rx="4" fill="#f7f7f7" stroke="#777" stroke-width="1"/>
<text x="28" y="730" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">本地状态</text>
<text x="28" y="754" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">broker: running</text>
<text x="28" y="776" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">127.0.0.1 only</text>
<rect x="210" y="0" width="1070" height="72" rx="0" fill="#eeeeee" stroke="#555" stroke-width="2"/>
<text x="238" y="44" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#222" text-anchor="start">首次配置与显式授权流程</text>
<text x="1228" y="42" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="end">用户本地会话</text>
<rect x="240" y="108" width="300" height="570" rx="4" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="256" y="136" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">1. 空状态</text>
<text x="256" y="164" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">尚未配置 GitHub App</text>
<text x="256" y="186" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">说明：broker 需要 App client id 才能开始授权</text>
<text x="256" y="208" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">按钮：添加 GitHub App</text>
<text x="256" y="230" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">辅助链接：如何创建测试 App</text>
<text x="256" y="252" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start"></text>
<text x="256" y="274" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">错误状态：</text>
<text x="256" y="296" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">· secret store unavailable</text>
<text x="256" y="318" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">· config invalid</text>
<rect x="570" y="108" width="300" height="570" rx="4" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="586" y="136" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">2. App 表单</text>
<text x="586" y="164" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">name / host / client id</text>
<text x="586" y="186" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">client secret：write-only</text>
<text x="586" y="208" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">保存后不显示完整秘密</text>
<text x="586" y="230" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start"></text>
<text x="586" y="252" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">校验错误：</text>
<text x="586" y="274" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">· client id 缺失</text>
<text x="586" y="296" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">· host 不被允许</text>
<text x="586" y="318" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">· secret 格式明显错误</text>
<rect x="900" y="108" width="300" height="570" rx="4" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="916" y="136" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">3. Device flow</text>
<text x="916" y="164" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">用户点击“开始授权”才启动</text>
<text x="916" y="186" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">显示 verification URI + user code</text>
<text x="916" y="208" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">pending：等待用户在 GitHub 确认</text>
<text x="916" y="230" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">success：账号/过期时间/范围摘要</text>
<text x="916" y="252" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">error：expired / access_denied / network</text>
<text x="916" y="274" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start"></text>
<text x="916" y="296" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">不会在普通 token 请求中自动弹出</text>
<line x1="540" y1="390" x2="570" y2="390" stroke="#555" stroke-width="2"/>
<line x1="870" y1="390" x2="900" y2="390" stroke="#555" stroke-width="2"/>
</svg>
