<rect x="14" y="192" width="182" height="38" rx="4" fill="#d4d4d4" stroke="#777" stroke-width="1"/>
<text x="30" y="216" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="start">GitHub Apps</text>
<rect x="14" y="244" width="182" height="38" rx="4" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>
<text x="30" y="268" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#222" text-anchor="start">Audit</text>
